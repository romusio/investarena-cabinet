services:
  db:
    image: postgres:16
    container_name: investarena_db
    environment:
      POSTGRES_DB: investarena
      POSTGRES_USER: investarena
      POSTGRES_PASSWORD: investarena_password
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  backend:
    image: node:20-alpine
    container_name: investarena_backend
    working_dir: /app
    volumes:
      - ./apps/backend:/app
    command: sh -c "npm install && npm run start:dev"
    environment:
      DATABASE_URL: postgres://investarena:investarena_password@db:5432/investarena
      JWT_ACCESS_SECRET: access_secret_change_me
      JWT_REFRESH_SECRET: refresh_secret_change_me
      PORT: "3001"
    ports:
      - "3001:3001"
    depends_on:
      - db

  frontend:
    image: node:20-alpine
    container_name: investarena_frontend
    working_dir: /app
    volumes:
      - ./apps/frontend:/app
    command: sh -c "npm install && npm run dev"
    environment:
      NEXT_PUBLIC_API_URL: /api
      NEXT_PUBLIC_WS_URL: /ws
      PORT: "3000"
    ports:
      - "3000:3000"
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    container_name: investarena_nginx
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    ports:
      - "8099:80"
    depends_on:
      - frontend
      - backend

volumes:
  db_data:
